[package]
name = "smovs"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
] }
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
inquire = { version = "0.9" }
tokio = { version = "1", features = ["full"] }
